name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore /p:Version=${{ steps.version.outputs.VERSION }} /p:AssemblyVersion=${{ steps.version.outputs.VERSION }}.0 /p:FileVersion=${{ steps.version.outputs.VERSION }}.0

      - name: Package
        run: |
          mkdir -p release/LogoSwap
          cp bin/Release/net9.0/LogoSwap.dll release/LogoSwap/
          cp bin/Release/net9.0/image.png release/LogoSwap/
          cd release
          zip -r ../LogoSwap_${{ steps.version.outputs.VERSION }}.zip LogoSwap/

      - name: Compute checksum
        id: checksum
        run: echo "MD5=$(md5sum LogoSwap_${{ steps.version.outputs.VERSION }}.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: LogoSwap_${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true

      - name: Update manifest.json
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHECKSUM="${{ steps.checksum.outputs.MD5 }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="${{ github.repository }}"

          jq --arg ver "$VERSION" \
             --arg cs "$CHECKSUM" \
             --arg ts "$TIMESTAMP" \
             --arg url "https://github.com/${REPO}/releases/download/v${VERSION}/LogoSwap_${VERSION}.zip" \
             '.[0].versions = [{
                version: $ver,
                changelog: "See release notes.",
                targetAbi: "10.11.0.0",
                sourceUrl: $url,
                checksum: $cs,
                timestamp: $ts
              }] + .[0].versions' manifest.json > manifest_tmp.json
          mv manifest_tmp.json manifest.json

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add manifest.json
          git commit -m "Update manifest for v${{ steps.version.outputs.VERSION }}"
          git push origin main
